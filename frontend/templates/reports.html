{% extends "base.html" %}
{% block title %}Rapports — NexusSecure{% endblock %}
{% block nav_reports %}active{% endblock %}
{% block topbar_title %}Rapports PDF{% endblock %}

{% block content %}
<div class="card-dark p-3">
  <table class="table table-dark table-hover table-sm">
    <thead><tr><th>#</th><th>Scan</th><th>Score de risque</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody id="reports-tbody"></tbody>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function downloadReport(id) {
  const res = await fetch(`/api/reports/${id}/download`, { headers: authHeaders() });
  if (!res.ok) { alert("Erreur lors du téléchargement"); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `nexussecure_report_${id}.pdf`;
  a.click(); URL.revokeObjectURL(url);
}

async function sendEmailReport(id) {
  const res = await fetch(`/api/reports/${id}/send-email`, { method: "POST", headers: authHeaders() });
  const data = await res.json();
  if (res.ok) alert(`📧 Email simulé envoyé à ${data.to}`);
  else alert("Erreur lors de l'envoi");
}

(async () => {
  const reports = await apiGet("/api/reports");
  const tbody = document.getElementById("reports-tbody");
  reports.forEach(r => {
    const score = r.risk_score;
    const cls = score >= 7 ? "text-danger" : score >= 4 ? "text-warning" : "text-success";
    tbody.insertAdjacentHTML("beforeend", `
      <tr>
        <td>${r.id}</td>
        <td>Scan #${r.scan_id}</td>
        <td><span class="${cls} fw-bold">${score} / 10</span></td>
        <td>${new Date(r.created_at).toLocaleString("fr-FR")}</td>
        <td>
          <button class="btn btn-sm btn-outline-accent me-1" onclick="downloadReport(${r.id})">
            <i class="bi bi-download me-1"></i>PDF
          </button>
          <button class="btn btn-sm btn-outline-info" onclick="sendEmailReport(${r.id})">
            <i class="bi bi-envelope me-1"></i>Email
          </button>
        </td>
      </tr>`);
  });
})();
</script>
{% endblock %}
