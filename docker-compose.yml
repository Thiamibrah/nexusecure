version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexussecure}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no default on purpose}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # dev convenience only; don't expose beyond localhost

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no default on purpose}@db:5432/${POSTGRES_DB:-nexussecure}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    network_mode: host  # required for nmap host discovery (ARP-based, needs L2 access)
    cap_add:
      - NET_RAW    # nmap SYN scan / host discovery — container runs as non-root (see Dockerfile)
      - NET_ADMIN

volumes:
  pgdata:
